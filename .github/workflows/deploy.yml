name: Deploy production to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify frontend and quotation behavior
        run: |
          npm ci
          npm run test:quotation-edit
          npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anshikatrivedii/configurator-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anshikatrivedii/configurator-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Copy deployment files and activate release
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          ssh -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=accept-new \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" 'mkdir -p /opt/configurator/app'
          scp -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=accept-new \
            compose.prod.yml scripts/deploy-lightsail.sh scripts/certbot-renew-hook.sh \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/opt/configurator/app/"
          ssh -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=accept-new \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo bash /opt/configurator/app/deploy-lightsail.sh $RELEASE_SHA"
